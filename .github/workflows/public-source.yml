name: Public source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Reject private files and identifiers
        run: node scripts/check-public-release.mjs
      - name: Install pinned Gitleaks
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan every fetched Git ref for credentials
        run: '"$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner --log-opts="--all" .'
