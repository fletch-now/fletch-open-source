# Product server context. Apply before Node, authentication and database access.
limit_req zone=fletch_api_ip burst=40 nodelay;
limit_req zone=fletch_auth_ip burst=10 nodelay;
limit_req zone=fletch_api_global burst=100 nodelay;
limit_req_status 429;
limit_conn fletch_api_connections 32;
limit_conn fletch_api_total 256;
limit_conn_status 429;
error_page 429 = @fletch_api_busy;
location @fletch_api_busy {
    default_type application/json;
    add_header Retry-After 1 always;
    add_header Cache-Control no-store always;
    return 429 '{"error":"Request limit reached. Wait before retrying."}';
}
