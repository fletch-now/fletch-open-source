# Include inside the builder.example.com HTTPS server. Public JSON has repeated provenance
# fields; compress it without changing private routes or Build event streams.
location ~ ^/api/v1/(chains(/|$)|tokens/|status$|openapi\.json$) {
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_vary on;
    gzip_proxied any;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Rate counters trust the first hop supplied by this proxy.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
