Host fletch-executor
    HostName 10.77.0.2
    User fletch-executor
    IdentityFile /etc/fletch/executor/id_ed25519
    UserKnownHostsFile /etc/fletch/executor/known_hosts
    StrictHostKeyChecking yes
    BatchMode yes
    IdentitiesOnly yes
    IdentityAgent none
    ConnectTimeout 5
    ServerAliveInterval 15
    ServerAliveCountMax 3
    ControlMaster no
    ControlPath /run/fletch-executor/control
