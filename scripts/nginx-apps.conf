# Hosted apps: https://<slug>.apps.example.com, one static directory per slug.
# Install: cp scripts/nginx-apps.conf /etc/nginx/sites-available/fletch-apps
#          ln -s /etc/nginx/sites-available/fletch-apps /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
#
# Certificates are per host, issued by scripts/fletch-publish-site at publish
# time over HTTP-01, so only a wildcard A record is needed from DNS. nginx 1.15.9+
# reads a variable certificate path per handshake, as the worker user, from the
# copies fletch-apps-cert-hook keeps under /etc/nginx/apps-certs. A host with no
# certificate fails the handshake, the right answer for a site that does not exist.

server {
  listen 80;
  listen [::]:80;
  server_name "~^(?<app>[a-z0-9][a-z0-9-]{1,60})\.apps\.example\.com$" apps.example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name "~^(?<app>[a-z0-9][a-z0-9-]{1,60})\.apps\.example\.com$" apps.example.com;

  # apps.example.com itself is not a site; send people to the product.
  if ($app = "") { return 302 https://builder.example.com/dashboard/projects; }

  # Copies readable by the workers (scripts/fletch-apps-cert-hook); the certbot
  # tree itself is root-only and a per-handshake path is read by www-data.
  ssl_certificate     /etc/nginx/apps-certs/$ssl_server_name/fullchain.pem;
  ssl_certificate_key /etc/nginx/apps-certs/$ssl_server_name/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  root /var/lib/fletch/sites/$app/current;
  index index.html;
  autoindex off;
  # A wildcard certificate also accepts unknown hostnames; they are not apps.
  if (!-f $document_root/index.html) { return 404; }

  # A generated page may read the chain and open a wallet, and nothing else. It
  # can be framed only by the studio on builder.example.com, cannot post to an outside host,
  # and cannot run inline script. No X-Frame-Options: it cannot name one other
  # origin, and browsers that support frame-ancestors ignore it anyway.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://builder.example.com https://rpc.mainnet.chain.robinhood.com https://rpc.testnet.chain.robinhood.com https://robinhoodchain.blockscout.com https://explorer.testnet.chain.robinhood.com https://api.robinhood.com https://*.walletconnect.com wss://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.org https://*.reown.com; frame-ancestors 'self' https://builder.example.com; base-uri 'none'; form-action 'none'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  location ~ /\. { return 404; }
  location ~* \.map$ { return 404; }

  location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|webp|ico)$ {
    expires 1h;
    try_files $uri =404;
  }

  location / {
    # HTML must revalidate when a new release replaces the current symlink.
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
