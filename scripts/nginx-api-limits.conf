# http context. Empty keys exclude static files and hosted app traffic.
map "$request_method:$uri" $fletch_api_ip {
    default "";
    ~^[A-Z]+:/api/ $binary_remote_addr;
    ~^(POST|PUT|PATCH|DELETE): $binary_remote_addr;
}
map $uri $fletch_auth_ip {
    default "";
    ~^/api/auth/ $binary_remote_addr;
}
map "$request_method:$uri" $fletch_api_global {
    default "";
    ~^[A-Z]+:/api/ fletch-api;
    ~^(POST|PUT|PATCH|DELETE): fletch-api;
}
limit_req_zone $fletch_api_ip zone=fletch_api_ip:10m rate=10r/s;
limit_req_zone $fletch_auth_ip zone=fletch_auth_ip:1m rate=1r/s;
limit_req_zone $fletch_api_global zone=fletch_api_global:1m rate=100r/s;
limit_conn_zone $fletch_api_ip zone=fletch_api_connections:10m;
limit_conn_zone $fletch_api_global zone=fletch_api_total:1m;
